<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Box Info &mdash; Pacific Sports</title>
<style>
  :root{
    --ink:#0f1720; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff; --accent:#0f1720;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8eef5; --muted:#94a3b8; --line:#1e293b; --bg:#0b1220; --card:#111a29; --accent:#e8eef5; }
  }
  *{ box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
  .wrap{ max-width:520px; margin:0 auto; padding:18px 14px 40px; }

  .brand{ display:flex; align-items:baseline; gap:8px; padding:6px 2px 14px; }
  .brand b{ font-size:17px; font-weight:800; letter-spacing:.2px; }
  .brand span{ font-size:12px; color:var(--muted); }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px;
         box-shadow:0 1px 2px rgba(15,23,32,.05); overflow:hidden; }

  .hero{ padding:20px 18px 16px; border-bottom:1px solid var(--line); }
  .hero .lab{ font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--muted); }
  .hero .style{ font-size:44px; font-weight:900; line-height:1; letter-spacing:-.5px; margin-top:4px; }
  .hero .item{ font-size:14px; font-weight:600; color:var(--muted); margin-top:7px; }

  .rows{ padding:4px 18px 8px; }
  .r{ display:flex; align-items:baseline; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
  .r:last-child{ border-bottom:none; }
  .r .k{ flex:none; width:96px; font-size:11px; font-weight:800; letter-spacing:.11em; color:var(--muted); }
  .r .v{ flex:1; font-size:19px; font-weight:800; word-break:break-word; }
  .r.big .v{ font-size:24px; }
  .r .v.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; font-weight:700; letter-spacing:.02em; }

  .tags{ display:flex; flex-wrap:wrap; gap:7px; padding:0 18px 18px; }
  .tag{ font-size:11.5px; font-weight:800; letter-spacing:.06em; padding:5px 10px; border-radius:999px;
        border:1px solid var(--line); color:var(--muted); }
  .tag.on{ border-color:var(--accent); color:var(--accent); }

  .foot{ text-align:center; padding:16px 18px 20px; border-top:1px solid var(--line); }
  .foot .h{ font-size:15px; font-weight:900; letter-spacing:.06em; }
  .foot .m{ font-size:11.5px; color:var(--muted); margin-top:3px; }

  .note{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.5; }
  .bad{ padding:28px 18px; text-align:center; }
  .bad .t{ font-size:17px; font-weight:800; }
  .bad .d{ font-size:13px; color:var(--muted); margin-top:8px; line-height:1.55; }
  .hide{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>PACIFIC SPORTS</b></div>

  <div class="card" id="card">
    <div class="hero">
      <div class="lab">STYLE</div>
      <div class="style" id="v-style">&mdash;</div>
      <div class="item hide" id="v-item"></div>
    </div>

    <div class="rows">
      <div class="r big" id="r-color"><span class="k">COLOR</span><span class="v" id="v-color"></span></div>
      <div class="r big" id="r-size"><span class="k">SIZE</span><span class="v" id="v-size"></span></div>
      <div class="r big" id="r-qty"><span class="k">QUANTITY</span><span class="v" id="v-qty"></span></div>
      <div class="r" id="r-lot"><span class="k">LOT</span><span class="v" id="v-lot"></span></div>
      <div class="r" id="r-ctn"><span class="k">CARTON #</span><span class="v mono" id="v-ctn"></span></div>
      <div class="r" id="r-sscc"><span class="k">SSCC</span><span class="v mono" id="v-sscc"></span></div>
      <div class="r" id="r-date"><span class="k">DATE</span><span class="v" id="v-date"></span></div>
    </div>

    <div class="tags" id="tags"></div>

    <div class="foot">
      <div class="h">MADE IN HAITI</div>
      <div class="m">Peace Textile America, Inc. dba Pacific Sports</div>
    </div>
  </div>

  <div class="card hide" id="empty">
    <div class="bad">
      <div class="t">No box data in this link</div>
      <div class="d">Scan the QR code on a carton label to open this page with that carton&rsquo;s details.</div>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
(function(){
  var GS1_PREFIX = '08600163991';   // Peace Textile America GS1 company prefix (11-digit form)

  function txt(id, v){ var e=document.getElementById(id); if(e) e.textContent = (v==null?'':String(v)); }
  function show(id, on){ var e=document.getElementById(id); if(e) e.classList[on?'remove':'add']('hide'); }

  // '+' means space inside our own path segments, so decode it explicitly
  function dec(s){
    if(s==null) return '';
    try{ return decodeURIComponent(String(s).replace(/\+/g,' ')); }
    catch(e){ return String(s).replace(/\+/g,' '); }
  }

  function gs1Check(body){                      // GS1 mod-10, body = 17 digits
    var sum=0, d=String(body);
    for(var i=0;i<d.length;i++){
      var n=parseInt(d.charAt(d.length-1-i),10); if(isNaN(n)) return -1;
      sum += n * ((i%2===0)?3:1);
    }
    return (10 - (sum%10)) % 10;
  }
  function ssccValid(s){
    s=String(s||''); if(!/^\d{18}$/.test(s)) return false;
    return gs1Check(s.slice(0,17)) === parseInt(s.charAt(17),10);
  }
  function ssccGrouped(s){ return s.charAt(0)+' '+s.substr(1,11)+' '+s.substr(12,5)+' '+s.charAt(17); }
  function ctnFromSscc(s){                      // ext digit + 5-digit serial, e.g. 0-00001
    if(!/^\d{18}$/.test(s)) return '';
    if(s.substr(1,11) !== GS1_PREFIX) return '';
    return s.charAt(0) + '-' + s.substr(12,5);
  }

  // ── read the box out of the URL ────────────────────────────────────────────
  // NEW  (uppercase path form, small QR):
  //      /box/00/{SSCC}/{STYLE}/{SIZE}/{QTY}/{COLOR}
  // OLD  (hash form, still on cartons already shipped):
  //      /box/#s=..&i=..&c=..&z=..&q=..&con=..&lot=..&us=1&b=..&ctn=..&sscc=..&d=..
  function readPath(){
    var p = decodeURI(location.pathname || '');
    var m = p.match(/\/00\/(\d{18})((?:\/[^\/]*)*)\/?$/i);
    if(!m) return null;
    var seg = m[2] ? m[2].replace(/^\//,'').split('/') : [];
    return { sscc:m[1], s:dec(seg[0]), z:dec(seg[1]), q:dec(seg[2]), c:dec(seg[3]) };
  }
  function readHash(){
    var h = (location.hash||'').replace(/^#/,'');
    if(!h) return null;
    var o={}, parts=h.split('&');
    for(var i=0;i<parts.length;i++){
      if(!parts[i]) continue;
      var k=parts[i].indexOf('='), key=k<0?parts[i]:parts[i].slice(0,k), val=k<0?'':parts[i].slice(k+1);
      o[dec(key)] = dec(val);
    }
    return Object.keys(o).length ? o : null;
  }

  var d = readPath() || readHash();
  if(!d){ show('card',false); show('empty',true); return; }

  var style = d.s || '';
  var color = d.c || '';
  var size  = d.z || '';
  var qty   = d.q || '';
  var lot   = d.lot || '';
  var sscc  = (d.sscc || '').replace(/\D/g,'');
  var ctn   = d.ctn || ctnFromSscc(sscc);
  var date  = d.d || '';
  var item  = d.i || '';
  var con   = d.con || '';
  var us    = (d.us === '1' || d.us === 'US');
  var bldg  = d.b || '';

  if(qty && /^\d+$/.test(qty)){
    var n = parseInt(qty,10), dz = n/12;
    qty = n + ' PCS' + (dz === Math.floor(dz) ? '  [' + dz + ' DZ]' : '');
  }

  txt('v-style', style || '—');
  txt('v-item', item); show('v-item', !!item);
  txt('v-color', color); show('r-color', !!color);
  txt('v-size',  size);  show('r-size',  !!size);
  txt('v-qty',   qty);   show('r-qty',   !!qty);
  txt('v-lot',   lot);   show('r-lot',   !!lot);
  txt('v-ctn',   ctn);   show('r-ctn',   !!ctn);
  txt('v-sscc',  sscc ? '(00) ' + ssccGrouped(sscc) : ''); show('r-sscc', !!sscc);
  txt('v-date',  date);  show('r-date',  !!date);

  var tags = [];
  if(con)  tags.push(['ON', con.toUpperCase()]);
  if(us)   tags.push(['ON', 'US COTTON']);
  if(bldg) tags.push(['', 'BLDG ' + bldg]);
  var tw = document.getElementById('tags');
  tags.forEach(function(t){
    var e=document.createElement('span'); e.className='tag'+(t[0]==='ON'?' on':''); e.textContent=t[1]; tw.appendChild(e);
  });

  var note = [];
  if(sscc && !ssccValid(sscc)) note.push('⚠ SSCC check digit does not match — re-scan or check the label.');
  note.push('Carton identified by SSCC (GS1 Application Identifier 00).');
  document.getElementById('note').innerHTML = note.join('<br>');
})();
</script>
</body>
</html>
